<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Онлик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0f11; --surface: #16181c; --surface2: #1e2026;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --text: #e8eaed; --muted: #5f6470; --accent: #c8ff00;
  --st-none-bg:#1e2026;   --st-none:#4a5060;
  --st-bought-bg:#141e2e; --st-bought:#5b7aad;
  --st-auth-bg:#0d1f35;   --st-auth:#3d85e0;
  --st-banned-bg:#2a0e0e; --st-banned:#e05555;
  --st-warmup-bg:#251900; --st-warmup:#d99a1a;
  --st-brand-bg:#1d0f2e;  --st-brand:#b060e8;
  --st-upload-bg:#0a2018; --st-upload:#3ec87a;
}
body { font-family:'JetBrains Mono',monospace; background:var(--bg); color:var(--text); min-height:100vh; }

/* ── LOGIN ── */
.login-wrap {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
}
.login-box {
  background:var(--surface); border:1px solid var(--border2); border-radius:16px;
  padding:40px 48px; display:flex; flex-direction:column; gap:20px; width:340px;
}
.login-logo { font-family:'Unbounded',sans-serif; font-size:22px; color:var(--accent); text-align:center; }
.login-sub { font-size:11px; color:var(--muted); text-align:center; margin-top:-10px; }
.login-input {
  background:var(--surface2); border:1px solid var(--border2); border-radius:8px;
  color:var(--text); font-family:'JetBrains Mono',monospace; font-size:14px;
  padding:10px 14px; width:100%; transition:border-color 0.15s;
}
.login-input:focus { outline:none; border-color:var(--accent); }
.login-btn {
  background:var(--accent); color:#000; border:none; border-radius:8px;
  font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600;
  padding:11px; cursor:pointer; transition:opacity 0.15s;
}
.login-btn:hover { opacity:0.85; }
.login-err { font-size:11px; color:var(--st-banned); text-align:center; min-height:14px; }

/* ── APP ── */
.app { display:none; }
.app.visible { display:block; }

.topbar {
  height:54px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:0 24px;
  position:sticky; top:0; z-index:50; overflow:hidden;
}
.logo { font-family:'Unbounded',sans-serif; font-size:15px; color:var(--accent); letter-spacing:-0.5px; flex-shrink:0; }
.tb-div { width:1px; height:22px; background:var(--border2); flex-shrink:0; }
.stats-bar { display:flex; gap:5px; flex:1; min-width:0; overflow:hidden; }
.stat-chip { display:flex; align-items:center; gap:5px; padding:3px 9px 3px 6px; border-radius:20px; border:1px solid var(--border2); font-size:11px; white-space:nowrap; flex-shrink:0; color:var(--muted); }
.stat-chip .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.stat-chip b { color:var(--text); font-weight:600; margin-left:2px; }
.topbar-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.save-ind { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; transition:color 0.3s; }
.save-ind.saved { color:var(--st-upload); }
.save-ind.err { color:var(--st-banned); }
.save-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
.last-upd { font-size:10px; color:var(--muted); white-space:nowrap; }
.btn-refresh {
  display:flex; align-items:center; gap:6px; padding:6px 13px;
  background:transparent; border:1px solid var(--border2); border-radius:8px;
  color:var(--text); font-family:'JetBrains Mono',monospace; font-size:11.5px;
  cursor:pointer; transition:all 0.15s; white-space:nowrap;
}
.btn-refresh:hover { border-color:var(--accent); color:var(--accent); }
.btn-refresh svg { width:13px; height:13px; flex-shrink:0; }
.btn-refresh.loading svg { animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.btn-icon {
  display:flex; align-items:center; gap:5px; padding:5px 10px;
  background:transparent; border:1px solid var(--border); border-radius:7px;
  color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px;
  cursor:pointer; transition:all 0.15s; white-space:nowrap;
}
.btn-icon:hover { border-color:var(--border2); color:var(--text); }
.btn-icon svg { width:12px; height:12px; }
.btn-logout {
  background:none; border:1px solid var(--border); border-radius:7px;
  color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px;
  padding:5px 10px; cursor:pointer; transition:all 0.15s;
}
.btn-logout:hover { border-color:var(--st-banned); color:var(--st-banned); }

.table-wrap { padding:20px 24px 60px; }
.table-scroll { border:1px solid var(--border); border-radius:10px; overflow-x:auto; }
.table-scroll::-webkit-scrollbar { height:5px; }
.table-scroll::-webkit-scrollbar-track { background:transparent; }
.table-scroll::-webkit-scrollbar-thumb { background:var(--border2); border-radius:10px; }
table { width:100%; border-collapse:collapse; white-space:nowrap; }
thead th {
  background:var(--surface); padding:9px 14px;
  font-size:10px; font-weight:500; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--muted); border-bottom:1px solid var(--border); text-align:left;
}
thead th.vg { background:var(--surface2); }
thead th.right { text-align:right; }
tbody tr { border-bottom:1px solid var(--border); transition:background 0.1s; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:rgba(255,255,255,0.022); }
td { padding:6px 14px; font-size:12.5px; vertical-align:middle; }
td.vg { background:rgba(255,255,255,0.012); }
tbody tr:hover td.vg { background:rgba(255,255,255,0.025); }
td.act { text-align:center; padding:0 8px; width:36px; }
td.right { text-align:right; }

input.ci {
  background:transparent; border:1px solid transparent; border-radius:6px;
  color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12px;
  padding:5px 8px; transition:border-color 0.15s,background 0.15s;
  -moz-appearance:textfield;
}
input.ci::-webkit-inner-spin-button, input.ci::-webkit-outer-spin-button { -webkit-appearance:none; }
input.ci:hover { border-color:var(--border2); background:var(--surface2); }
input.ci:focus { outline:none; border-color:rgba(200,255,0,0.35); background:rgba(200,255,0,0.04); }
input.ci::placeholder { color:var(--muted); font-size:11px; }
input.ni { width:64px; text-align:center; }
input.li { width:142px; }
input.wi { width:58px; text-align:center; }
input.ei { width:200px; }
input.si { width:140px; }
input.si::-webkit-calendar-picker-indicator { display:none !important; }

.sv { display:block; text-align:right; font-size:12.5px; color:var(--text); }
.sv.empty { color:var(--muted); }
.sv.loading { color:var(--muted); font-size:11px; }
.sv.err { color:var(--st-banned); font-size:10px; }
.sv.green { color:var(--st-upload); }

select.status-sel {
  appearance:none; -webkit-appearance:none; border:none; border-radius:20px;
  font-family:'JetBrains Mono',monospace; font-weight:500; font-size:11px;
  padding:5px 11px; width:148px; cursor:pointer; transition:opacity 0.15s;
}
select.status-sel:focus { outline:none; }
select.status-sel:hover { opacity:0.85; }
select.status-sel option { background:#1e2026; color:var(--text); }
.s-none   { background:var(--st-none-bg);   color:var(--st-none);   }
.s-bought { background:var(--st-bought-bg); color:var(--st-bought); }
.s-auth   { background:var(--st-auth-bg);   color:var(--st-auth);   }
.s-banned { background:var(--st-banned-bg); color:var(--st-banned); }
.s-warmup { background:var(--st-warmup-bg); color:var(--st-warmup); }
.s-brand  { background:var(--st-brand-bg);  color:var(--st-brand);  }
.s-upload { background:var(--st-upload-bg); color:var(--st-upload); }

.btn-del {
  width:26px; height:26px; border-radius:6px; border:1px solid transparent;
  background:transparent; color:var(--muted); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; transition:all 0.15s;
}
.btn-del:hover { background:rgba(224,85,85,0.12); border-color:rgba(224,85,85,0.3); color:#e05555; }
.btn-del svg { width:13px; height:13px; pointer-events:none; }

.add-row td { padding:0; border-top:1px dashed rgba(255,255,255,0.06); }
.btn-add-row {
  width:100%; background:none; border:none; color:var(--muted);
  font-family:'JetBrains Mono',monospace; font-size:11.5px;
  padding:11px 20px; cursor:pointer; display:flex; align-items:center; gap:7px;
  transition:color 0.15s; text-align:left;
}
.btn-add-row:hover { color:var(--accent); }
.btn-add-row svg { width:13px; height:13px; flex-shrink:0; }
.ch-id-tag { font-size:10px; color:var(--muted); display:block; margin-top:1px; max-width:140px; overflow:hidden; text-overflow:ellipsis; }

/* drag & drop */
.drag-handle {
  width:20px; height:26px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--muted); cursor:grab; border-radius:4px; transition:color 0.15s;
  vertical-align:middle;
}
.drag-handle:hover { color:var(--text); }
.drag-handle:active { cursor:grabbing; }
.drag-handle svg { width:14px; height:14px; pointer-events:none; }
tr.dragging { opacity:0.4; }
tr.drag-over td { background:rgba(200,255,0,0.06) !important; border-top:2px solid var(--accent) !important; }
td.act { display:flex; align-items:center; gap:2px; }
body.readonly .btn-del { display:none; }
body.readonly .btn-add-row { display:none; }
body.readonly input.ci { pointer-events:none; }
body.readonly select.status-sel { pointer-events:none; }
body.readonly .btn-refresh { display:none; }
body.readonly .btn-icon { display:none; }
</style>
</head>

// ── AUTH ──
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  const hash = await sha256(pwd);
  if (hash === PASSWORD_HASH) {
    isAdmin = true;
    sessionStorage.setItem('onlik_auth', 'admin');
  } else if (pwd === 'view') {
    // read-only mode
    isAdmin = false;
    sessionStorage.setItem('onlik_auth', 'view');
  } else {
    document.getElementById('loginErr').textContent = 'Неверный пароль';
    return;
  }
  showApp();
}

function doLogout() {
  sessionStorage.removeItem('onlik_auth');
  location.reload();
}

function showApp() {

  document.getElementById('appWrap').classList.add('visible');
  if (!isAdmin) document.body.classList.add('readonly');
  init();
}

// Check session
window.addEventListener('DOMContentLoaded', () => {

// ── SUPABASE API ──
async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...options.headers
    }
  });
  if (res.status === 204 || res.status === 200 || res.status === 201) {
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }
  throw new Error(`Supabase error ${res.status}: ${await res.text()}`);
}

async function loadFromSupabase() {
  const data = await sbFetch('accounts?order=sort_order.asc&select=*');
  return (data || []).map((r, i) => ({
    id: r.id,
    email: r.email || '',
    shop: r.shop || '',
    price: r.price || '',
    status: r.status || '—',
    warmupDay: r.warmup_day || '',
    link: r.link || '',
    channelId: r.channel_id || '',
    deleted: r.deleted || '',
    note: r.note || '',
    sortOrder: r.sort_order ?? i,
    _stats: r.stats || null
  }));
}

async function upsertRow(row) {
  await sbFetch('accounts', {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({
      id: row.id,
      email: row.email,
      shop: row.shop,
      price: row.price,
      status: row.status,
      warmup_day: row.warmupDay,
      link: row.link,
      channel_id: row.channelId,
      deleted: row.deleted,
      note: row.note || '',
      sort_order: row.sortOrder ?? 0,
      stats: row._stats || null,
      updated_at: new Date().toISOString()
    })
  });
}

async function saveOrder() {
  // update sort_order for all rows
  try {
    for (let i = 0; i < rows.length; i++) {

// ── SAVE INDICATOR ──
let saveTimer;

function indicateErr() {

}

// ── STATS ──
function updateStats() {
  const counts = {};
  STATUS_LIST.forEach(s => counts[s.text] = 0);
  rows.forEach(r => { const v = r.status||'—'; if(counts[v]!==undefined) counts[v]++; else counts['—']++; });
  const bar = document.getElementById('statsBar');
  bar.innerHTML = '';
  STATUS_LIST.forEach(s => {
    if(counts[s.text]>0)
      bar.innerHTML += `<div class="stat-chip"><div class="dot" style="background:${s.dot}"></div>${s.text==='—'?'без статуса':s.text}<b>${counts[s.text]}</b></div>`;
  });
}

// ── YOUTUBE API ──
const sleep = ms => new Promise(res => setTimeout(res, ms));

async function apiFetch(url, retries=3, delay=1000) {
  for (let i=0; i<retries; i++) {
    try {
      const r = await fetch(url);
      if (r.status===429||r.status===403) { await sleep(delay*(i+2)); continue; }
      const d = await r.json();
      if (d.error) { if (d.error.code===429||d.error.code===403) { await sleep(delay*(i+2)); continue; } return null; }
      return d;
    } catch(e) { if (i<retries-1) await sleep(delay); }
  }
  return null;
}

function parseYTLink(url) {
  if (!url||!url.trim()) return null;
  url = url.trim();
  try { url = decodeURIComponent(url); } catch(e) {}
  if (/^UC[\w-]{22}$/.test(url)) return { type:'id', value:url };
  try {
    const u = new URL(url.startsWith('http')?url:'https://'+url);
    const p = u.pathname;
    const m1=p.match(/\/channel\/(UC[\w-]{22})/); if(m1) return{type:'id',value:m1[1]};
    const m2=p.match(/^\/@(.+)/);                  if(m2) return{type:'handle',value:m2[1]};
    const m3=p.match(/^\/c\/(.+)/);                if(m3) return{type:'handle',value:m3[1]};
    const m4=p.match(/^\/user\/(.+)/);             if(m4) return{type:'user',value:m4[1]};
  } catch(e) {}
  return null;
}

async function resolveChannelId(parsed) {
  if (!parsed) return null;
  if (parsed.type==='id') return parsed.value;
  const d1 = await apiFetch(`https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${encodeURIComponent(parsed.value)}&key=${API_KEY}`);
  if (d1&&d1.items&&d1.items.length) return d1.items[0].id;
  await sleep(300);
  const d2 = await apiFetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${encodeURIComponent(parsed.value)}&maxResults=1&key=${API_KEY}`);
  if (d2&&d2.items&&d2.items.length) return d2.items[0].snippet.channelId;
  return null;
}

async function fetchChannelStats(channelId) {
  const d = await apiFetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&key=${API_KEY}`);
  if (!d||!d.items||!d.items.length) return null;
  const s = d.items[0].statistics;
  return { views:parseInt(s.viewCount||0,10), subs:parseInt(s.subscriberCount||0,10), hiddenSubs:s.hiddenSubscriberCount };
}

async function fetchVideosInPeriod(channelId, days) {
  const since = new Date(); since.setDate(since.getDate()-days);
  const publishedAfter = since.toISOString();
  let count=0, pageToken='';
  for (let page=0; page<3; page++) {
    const url=`https://www.googleapis.com/youtube/v3/search?part=id&channelId=${channelId}&type=video&publishedAfter=${publishedAfter}&maxResults=50&order=date${pageToken?'&pageToken='+pageToken:''}&key=${API_KEY}`;
    const d = await apiFetch(url);
    if (!d||!d.items) break;
    count+=d.items.length;
    if (!d.nextPageToken) break;
    pageToken=d.nextPageToken;
    await sleep(200);
  }
  return count;
}

function fmtNum(n) {
  if (n===null||n===undefined) return '—';
  if (n<0) return '0';
  if (n>=1000000000) return (n/1000000000).toFixed(1)+'B';
  if (n>=1000000) return (n/1000000).toFixed(2)+'M';
  if (n>=1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}

async function refreshAll() {
  if (!isAdmin) return;
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('loading'); btn.disabled=true;
  rows.forEach(row => {
    if (!row.link||!row.link.trim()) return;
    const tr = document.querySelector(`tr[data-id="${row.id}"]`);
    if (!tr) return;
    ['views','subs','v7','v30'].forEach(k => setStat(tr,k,'loading'));
  });
  for (const row of rows) { await refreshRow(row); await sleep(400); }
  document.getElementById('lastUpd').textContent = 'обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  btn.classList.remove('loading'); btn.disabled=false;
}

async function refreshRow(row) {
  if (!row.link||!row.link.trim()) return;
  const tr = document.querySelector(`tr[data-id="${row.id}"]`);
  if (!tr) return;
  try {
    if (!row.channelId) {
      const cid = await resolveChannelId(parseYTLink(row.link));
      if (!cid) { ['views','subs','v7','v30'].forEach(k=>setStat(tr,k,'err','нет канала')); return; }
      row.channelId=cid;
      const tag=tr.querySelector('.ch-id-tag'); if(tag) tag.textContent=cid;
    }
    await sleep(200);
    const stats = await fetchChannelStats(row.channelId);
    if (!stats) { ['views','subs','v7','v30'].forEach(k=>setStat(tr,k,'err','err')); return; }
    setStat(tr,'views','ok',fmtNum(stats.views));
    setStat(tr,'subs','ok',stats.hiddenSubs?'скрыты':fmtNum(stats.subs));
    await sleep(300);
    const v7 = await fetchVideosInPeriod(row.channelId,7);
    setStat(tr,'v7','ok',v7.toString(),v7>0);
    await sleep(300);
    const v30 = await fetchVideosInPeriod(row.channelId,30);
    setStat(tr,'v30','ok',v30.toString(),v30>0);
    row._stats={views:stats.views,subs:stats.subs,hiddenSubs:stats.hiddenSubs,v7,v30};
    // save to supabase
    try { await upsertRow(row); indicateSaved(); } catch(e) { indicateErr(); }
  } catch(e) { ['views','subs','v7','v30'].forEach(k=>setStat(tr,k,'err','ошибка')); }
}

function setStat(tr,key,state,val,green) {
  const el=tr.querySelector(`[data-stat="${key}"]`);
  if(!el) return;
  if(state==='loading'){el.textContent='...';el.className='sv loading';}
  else if(state==='err'){el.textContent=val||'err';el.className='sv err';}
  else{el.textContent=val||'—';el.className=green?'sv green':(val==='0'||val==='—'?'sv empty':'sv');}
}

function restoreStats(row,tr) {
  if (!row._stats) return;
  const s=row._stats;
  setStat(tr,'views','ok',fmtNum(s.views));
  setStat(tr,'subs','ok',s.hiddenSubs?'скрыты':fmtNum(s.subs));
  setStat(tr,'v7','ok',s.v7.toString(),s.v7>0);
  setStat(tr,'v30','ok',s.v30.toString(),s.v30>0);
}

function statusCls(t){return(STATUS_LIST.find(s=>s.text===t)||STATUS_LIST[0]).cls;}
function esc(v){return(v||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function uid(){return Math.random().toString(36).slice(2,10);}
function newRow(email){return{id:uid(),email:email||'',shop:'',price:'',status:'—',warmupDay:'',link:'',channelId:'',deleted:'',note:'',sortOrder:rows.length,_stats:null};}

function makeRow(row) {
  const tr=document.createElement('tr');
  tr.dataset.id=row.id;
  tr.draggable = isAdmin;
  const statusOpts=STATUS_LIST.map(s=>`<option value="${esc(s.text)}" ${row.status===s.text?'selected':''}>${s.text}</option>`).join('');
  const isWarmup=row.status==='Прогрев';
  tr.innerHTML=`
    <td class="act">
      ${isAdmin ? `<div class="drag-handle" title="Перетащить">
        <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="7" cy="5" r="1.5"/><circle cx="13" cy="5" r="1.5"/><circle cx="7" cy="10" r="1.5"/><circle cx="13" cy="10" r="1.5"/><circle cx="7" cy="15" r="1.5"/><circle cx="13" cy="15" r="1.5"/></svg>

        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </td>
    <td><input class="ci ei" type="text" placeholder="email@gmail.com" data-field="email" value="${esc(row.email)}"></td>
    <td><input class="ci si" type="text" list="shopSuggestions" placeholder="Магазин..." data-field="shop" value="${esc(row.shop)}"></td>
    <td><input class="ci ni" type="number" placeholder="—" data-field="price" value="${esc(row.price)}"></td>
    <td><select class="status-sel ${statusCls(row.status)}" data-field="status">${statusOpts}</select></td>
    <td style="text-align:center">
      <input class="ci wi" type="number" placeholder="день" min="1" data-field="warmupDay" value="${esc(row.warmupDay)}" style="display:${isWarmup?'inline-block':'none'}">
      <span class="wd-dash" style="color:var(--muted);font-size:11px;display:${isWarmup?'none':'inline'}">—</span>
    </td>
    <td>
      <input class="ci li" type="text" placeholder="https://youtube.com/..." data-field="link" value="${esc(row.link)}">
      <span class="ch-id-tag">${esc(row.channelId)}</span>
    </td>
    <td class="vg right"><span class="sv empty" data-stat="views">—</span></td>
    <td class="vg right"><span class="sv empty" data-stat="subs">—</span></td>
    <td class="vg right"><span class="sv empty" data-stat="v7">—</span></td>
    <td class="vg right"><span class="sv empty" data-stat="v30">—</span></td>
    <td style="text-align:center"><input class="ci ni" type="number" placeholder="0" data-field="deleted" value="${esc(row.deleted)}"></td>
    <td><input class="ci" style="width:175px" type="text" placeholder="заметка..." data-field="note" value="${esc(row.note||'')}"></td>
  `;

  tr.querySelector('.btn-del').addEventListener('click', async () => {
    if (!confirm('Удалить?')) return;
    rows=rows.filter(r=>r.id!==row.id);
    tr.remove(); updateStats();
    try { await deleteRow(row.id); indicateSaved(); } catch(e) { indicateErr(); }
  });

  const statusSel=tr.querySelector('.status-sel');
  statusSel.addEventListener('change', async () => {
    const v=statusSel.value;
    statusSel.className=`status-sel ${statusCls(v)}`;
    tr.querySelector('[data-field=warmupDay]').style.display=v==='Прогрев'?'inline-block':'none';
    tr.querySelector('.wd-dash').style.display=v==='Прогрев'?'none':'inline';
    row.status=v; updateStats();
    try { await upsertRow(row); indicateSaved(); } catch(e) { indicateErr(); }
  });

  const linkInp=tr.querySelector('[data-field=link]');
  linkInp.addEventListener('change', async () => {
    row.channelId=''; row._stats=null;
    const tag=tr.querySelector('.ch-id-tag'); if(tag) tag.textContent='';
    row.link=linkInp.value;
    try { await upsertRow(row); indicateSaved(); } catch(e) { indicateErr(); }
  });

  tr.querySelectorAll('input[data-field]').forEach(inp => {
    if (inp.dataset.field==='link') return;
    inp.addEventListener('change', async () => {
      row[inp.dataset.field]=inp.value;
      try { await upsertRow(row); indicateSaved(); } catch(e) { indicateErr(); }
    });
  });

  // drag & drop
  if (isAdmin) {
    tr.addEventListener('dragstart', e => {
      dragSrc = tr;
      tr.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    tr.addEventListener('dragend', () => {
      tr.classList.remove('dragging');
      document.querySelectorAll('tr.drag-over').forEach(r => r.classList.remove('drag-over'));
    });
    tr.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (dragSrc && dragSrc !== tr && !tr.classList.contains('add-row')) {
        document.querySelectorAll('tr.drag-over').forEach(r => r.classList.remove('drag-over'));
        tr.classList.add('drag-over');
      }
    });
    tr.addEventListener('drop', async e => {
      e.preventDefault();
      if (!dragSrc || dragSrc === tr || tr.classList.contains('add-row')) return;
      tr.classList.remove('drag-over');
      const tbody = document.getElementById('tbody');
      const addTr = document.getElementById('addRowTr');
      const allTrs = [...tbody.querySelectorAll('tr:not(#addRowTr)')];
      const srcIdx = allTrs.indexOf(dragSrc);
      const tgtIdx = allTrs.indexOf(tr);
      if (srcIdx < 0 || tgtIdx < 0) return;
      // reorder DOM
      if (srcIdx < tgtIdx) tbody.insertBefore(dragSrc, tr.nextSibling);
      else tbody.insertBefore(dragSrc, tr);
      // reorder rows array
      const [moved] = rows.splice(srcIdx, 1);
      rows.splice(tgtIdx, 0, moved);
      // save new order
      await saveOrder();
    });
  }

  return tr;
}

async function addRow() {
  const row=newRow(''); rows.push(row);
  const addTr=document.getElementById('addRowTr');
  const tr=makeRow(row);
  document.getElementById('tbody').insertBefore(tr,addTr);
  tr.querySelector('input[data-field=email]').focus();
  updateStats();
  try { await upsertRow(row); indicateSaved(); } catch(e) { indicateErr(); }
}

function rebuildTable() {
  const tbody=document.getElementById('tbody');
  const addTr=document.getElementById('addRowTr');
  [...tbody.querySelectorAll('tr:not(#addRowTr)')].forEach(tr=>tr.remove());
  rows.forEach(row => {
    const tr=makeRow(row);
    tbody.insertBefore(tr,addTr);
    restoreStats(row,tr);
  });
}
